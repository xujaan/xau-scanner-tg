# Salin ke k8s/secret.yaml (sudah di-.gitignore), isi nilai asli, lalu:
#   kubectl apply -f k8s/secret.yaml
#
# Baris yang dikomentari bersifat opsional: biarkan mati kalau tidak dipakai,
# supaya placeholder tidak sampai mengaktifkan fitur dengan nilai palsu.
apiVersion: v1
kind: Secret
metadata:
  name: xau-scanner-secrets
  namespace: third-party
type: Opaque
stringData:
  # --- Wajib ---
  TELEGRAM_TOKEN: "ISI_TOKEN_BOTFATHER"
  TELEGRAM_CHAT_ID: "ISI_CHAT_ID"
  TWELVEDATA_API_KEY: "ISI_API_KEY_TWELVEDATA"

  # --- Database Turso/libSQL (opsional; tanpa ini bot memakai SQLite lokal di DB_FILE) ---
  # Format URL: libsql://nama-database-akun.turso.io
  # TURSO_DATABASE_URL: "libsql://ISI-DB.turso.io"
  # TURSO_AUTH_TOKEN: "ISI_TOKEN_TURSO"

  # --- Lapisan AI second opinion (opsional) ---
  # OPENROUTER_API_KEY: "ISI_KEY_OPENROUTER"

  # --- OANDA (opsional; hanya dipakai bila DATA_PROVIDER=oanda) ---
  # OANDA_API_KEY: "ISI_TOKEN_OANDA"
  # OANDA_ACCOUNT_ID: "ISI_ACCOUNT_ID_OANDA"
