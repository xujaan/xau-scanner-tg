apiVersion: apps/v1
kind: Deployment
metadata:
  name: xau-scanner
  namespace: third-party
  labels:
    app: xau-scanner
spec:
  replicas: 1
  # Recreate: never run two instances at once, or the TwelveData
  # daily quota (800 requests) is consumed twice as fast.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xau-scanner
  template:
    metadata:
      labels:
        app: xau-scanner
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: bot
          # Ganti dengan image Docker Hub Anda
          image: xujaan/xau-scanner-tg:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: xau-scanner-secrets
          env:
            # root filesystem is read-only; matplotlib needs a writable cache
            - name: MPLCONFIGDIR
              value: /tmp/mpl
            # Everything the bot writes lives under /data (emptyDir here).
            # With TURSO_DATABASE_URL set the DB is remote, but the state and
            # journal files still need a writable path.
            - name: STATE_FILE
              value: /data/signal_state.json
            - name: JOURNAL_FILE
              value: /data/signal_journal.json
            - name: DB_FILE
              value: /data/signals.db
            - name: DATA_PROVIDER
              value: twelvedata
            - name: OPENROUTER_MODEL
              value: deepseek/deepseek-v4.1-flash-1017
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
